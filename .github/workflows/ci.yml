name: ci
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Builds and tests on Arch Linux, the primary target, inside the official
  # container so the FFmpeg/rustc/clang versions match what `pacman -S` gives a
  # user. The full cargo output is committed back as ci-log.txt, because the
  # agent sandbox cannot download Actions logs.
  arch:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    env:
      CARGO_TERM_COLOR: never
      CARGO_HOME: /root/.cargo
    steps:
      - name: packages
        run: |
          pacman -Syu --noconfirm --needed --quiet \
            rust clang pkgconf git base-devel \
            ffmpeg alsa-lib libva vulkan-icd-loader mesa wayland libxkbcommon \
            libx11 libxcursor libxi libxrandr udev
          rustc --version
          pkg-config --modversion libavcodec libavformat libavutil libswscale libswresample
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            /root/.cargo/registry
            /root/.cargo/git
            target
          key: arch-cargo-${{ github.run_id }}
          restore-keys: |
            arch-cargo-
      - name: check
        run: |
          set +e
          {
            echo "===== cargo check --all-targets ====="
            cargo check --all-targets 2>&1
            echo "check exit: $?"
            echo
            echo "===== cargo test ====="
            cargo test --all-targets 2>&1
            echo "test exit: $?"
            echo
            echo "===== warning count ====="
            cargo check --all-targets --message-format short 2>&1 | grep -c warning
          } > ci-log.txt 2>&1
          tail -40 ci-log.txt || true
      - name: upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: ci-log.txt
      - name: publish log
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -x
          git config user.name ci
          git config user.email ci@localhost
          git add -f ci-log.txt
          git commit -q -m "ci: run report [skip ci]" || echo "nothing new to commit"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            # Put our one commit back on top of whatever landed meanwhile.
            if ! git rebase -q FETCH_HEAD; then
              git rebase --abort || true
              git reset -q --soft FETCH_HEAD
              git commit -q -m "ci: run report [skip ci]" || true
            fi
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo "pushed"
              break
            fi
            sleep 6
          done
          git log --oneline -3
