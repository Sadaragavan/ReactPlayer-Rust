name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          cargo --version
          rustc --version
          which clang pkg-config ffmpeg || true
      - name: crate versions
        run: |
          for c in eframe egui-wgpu wgpu bytemuck ffmpeg-next ffmpeg-sys-next cpal ringbuf arboard rfd directories serde serde_json image; do
            v=$(curl -s "https://crates.io/api/v1/crates/$c" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['crate']['max_stable_version'])" 2>/dev/null)
            echo "$c = $v"
          done
      - name: system ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev libavdevice-dev libasound2-dev libva-dev libvulkan-dev pkg-config clang
          pkg-config --modversion libavcodec libavformat libavutil libswscale libswresample libavfilter libavdevice
          ffmpeg -version | head -2
