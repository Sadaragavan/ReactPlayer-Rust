[package]
name = "reaction-player"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Frame-accurate multi-stream video reaction player and alignment tool"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sadaragavan/ReactPlayer-Rust"
readme = "README.md"
keywords = ["video", "ffmpeg", "reaction", "alignment", "egui"]
categories = ["multimedia::video"]
default-run = "reaction-player"

[dependencies]
# UI / GPU. eframe re-exports egui, egui_wgpu and wgpu; we must not depend on
# those crates directly or we would end up with duplicate-type conflicts.
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
bytemuck = { version = "1.25", features = ["derive"] }

# Media: the crate major version tracks the system FFmpeg major version.
# ffmpeg-next 9.x == FFmpeg 9.x (libavcodec >= 63.1). See README "FFmpeg pairing".
ffmpeg-next = "9.1"
ffmpeg-sys-next = "9.1"

# Audio
cpal = "0.19"
ringbuf = "0.6"

# OS / persistence
arboard = { version = "2.0", default-features = false, features = ["image-data"] }
rfd = "0.18"
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Wayland data-control protocol gives a real clipboard on wlroots/sway etc.
arboard = { version = "2.0", default-features = false, features = [
    "image-data",
    "wayland-data-control",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_must_use = "warn"
