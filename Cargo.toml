[package]
name = "reaction-player"
version = "0.1.0"
edition = "2024"
# egui/eframe 0.37 is the real floor: it declares rust-version 1.95 itself.
rust-version = "1.95"
description = "Frame-accurate multi-stream video reaction player and alignment tool"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sadaragavan/ReactPlayer-Rust"
readme = "README.md"
keywords = ["video", "ffmpeg", "reaction", "alignment", "egui"]
categories = ["multimedia::video"]
default-run = "reaction-player"

[dependencies]
# UI / GPU. eframe re-exports egui, egui_wgpu and wgpu; those crates are never
# depended on directly, so there is exactly one copy of each type in the graph.
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
bytemuck = { version = "1.25", features = ["derive"] }

# Media. The crate majors track the system FFmpeg major: 9.x <-> libavcodec 63.
ffmpeg-next = "9.1"
ffmpeg-sys-next = "9.1"

# Audio: one lock-free SPSC ring buffer per track, mixed in a single callback.
cpal = "0.18"
ringbuf = "0.6"

# OS integration and persistence.
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
rfd = "0.18"
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Wayland data-control gives a working clipboard under wlroots/sway.
arboard = { version = "3.7", default-features = false, features = [
    "image-data",
    "wayland-data-control",
] }

[dev-dependencies]
# Same naga as wgpu 30, used by tests to parse `src/gpu/shader.wgsl` so a broken
# shader fails `cargo test` instead of failing at runtime.
naga = { version = "30.0", features = ["wgsl-in"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
